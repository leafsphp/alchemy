app:
  - src

tests:
  engine: pest
  paths:
    - tests
  files:
    - '*.test.php'
  coverage:
    local: false
    actions: true

lint:
  preset: PSR12
  rules:
    single_quote: true
    no_unused_imports: true
    array_syntax:
      syntax: short

analyse:
  level: 5
  paths:
    - src
  baseline: phpstan-baseline.neon
  includes:
    - vendor/phpstan/phpstan/conf/bleedingEdge.neon
  treatPhpDocTypesAsCertain: false

refactor:
  php: '8.3'
  sets:
    - dead-code
    - code-quality
  fluent-new-line: true
  import-names: true

actions:
  provider: github
  run:
    - lint
    - tests
  os:
    - ubuntu-latest
    - macos-latest
    - windows-latest
  php:
    extensions: json, zip
    versions:
      - '8.2'
      - '8.3'
      - '8.4'
  events:
    - push
    - pull_request
