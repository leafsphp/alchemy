name: Lint code

on: ACTIONS.EVENTS

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 'ACTIONS.PHP.VERSION'
          extensions: ACTIONS.PHP.EXTENSIONS
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer update --no-interaction --no-progress

      - name: Run Linter
        run: ACTIONS.LINT.RUNACTIONS.LINT.STEPS
